services:
  - type: web
    name: kksonline-backend
    env: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run prisma:generate && npx tsc && npx tsc-alias && node scripts/fix-imports.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: kksonline-backend
          property: port
    healthCheckPath: /api/v1/health
    autoDeploy: true
    # Note: Add all other environment variables in Render Dashboard > Environment
