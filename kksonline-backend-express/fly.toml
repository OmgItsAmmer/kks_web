# fly.toml app configuration file generated for kksonline-backend on 2026-06-01T05:13:20+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kksonline-backend'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  UV_THREADPOOL_SIZE = '8'

[processes]
  app = 'node dist/index.js'

[http_service]
  internal_port = 8080
  force_https = true
  # Always on (plan 0.3): no 2-4 s cold start, and the in-memory cache stays warm
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    # The plain /health never queries the database (see routes/index.ts)
    path = '/api/v1/health'

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 400

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  # 512 MB: image processing (sharp) needs headroom for large uploads
  memory_mb = 512

[[metrics]]
  port = 9091
  path = '/metrics'
