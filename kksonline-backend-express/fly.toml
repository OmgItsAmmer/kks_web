# Fly.io configuration for minimal cost deployment
# Optimized for 1000-1500 requests/day with scale-to-zero

app = "kksonline-backend"
primary_region = "iad"  # Washington, D.C. - adjust to your region

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/v1/health"

[processes]
  app = "node dist/index.js"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[metrics]
  port = 9091
  path = "/metrics"

# Scale-to-zero configuration
# Machines will stop after 5 minutes of inactivity
# Machines will start automatically on first request (cold start ~10-15s)
