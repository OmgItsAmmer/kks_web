# Development API: runs the NEW backend on the Neon `dev` branch for the Vercel admin.
# Deploy with:  fly deploy -c fly.dev.toml
# This is a separate app from `kksonline-backend` (the live shop's API on Supabase, behind api.kks-online.com).
# Sleeps when idle to cost almost nothing; the first request after a pause takes a few seconds.
# At cutover, switch to fly.toml (always on) as planned in plan.md 0.3.

app = 'kks-api-dev'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  UV_THREADPOOL_SIZE = '8'
  DEPLOY_TIER = 'dev'

[processes]
  app = 'node dist/index.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    # /health never queries the database, so the check does not keep Neon awake
    path = '/api/v1/health'

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 400

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  # 512 MB: image processing (sharp) needs headroom for large uploads
  memory_mb = 512
