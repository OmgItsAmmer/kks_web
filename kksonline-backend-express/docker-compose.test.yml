services:
  postgres:
    image: postgres:16-alpine
    container_name: kks-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kks_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kks_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - kks_test_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kks-test-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: test
      PORT: 8080
      API_VERSION: v1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kks_test?schema=public
      SUPABASE_URL: https://test-project.supabase.co
      SUPABASE_SERVICE_KEY: test-service-key
      JWT_SECRET: test-jwt-secret-minimum-32-characters-long
      GOOGLE_CLIENT_ID: test-google-client-id.apps.googleusercontent.com
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  kks_test_pgdata:
