<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons: .ico for old browsers and Google, SVG for modern browsers, PNG sizes, Apple home-screen icon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#e30613" />

    <!-- Search engines. These are the defaults; every page replaces them with its own (src/seo/useSeo.ts) -->
    <title>KKS Online | Online Grocery Store in Pakistan</title>
    <meta
      name="description"
      content="Order daily grocery items online from KKS Online. Serving quality karyana, household essentials, and pantry staples in Pakistan since 1995."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://www.kks-online.com/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Google Discover) -->
    <meta property="og:site_name" content="KKS Online" />
    <meta property="og:locale" content="en_PK" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KKS Online | Online Grocery Store in Pakistan" />
    <meta
      property="og:description"
      content="Order daily grocery items online from KKS Online. Serving quality karyana, household essentials, and pantry staples in Pakistan since 1995."
    />
    <meta property="og:url" content="https://www.kks-online.com/" />
    <meta property="og:image" content="https://www.kks-online.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KKS Online: daily grocery and karyana in Pakistan since 1995" />

    <!-- X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KKS Online | Online Grocery Store in Pakistan" />
    <meta
      name="twitter:description"
      content="Order daily grocery items online from KKS Online. Serving quality karyana, household essentials, and pantry staples in Pakistan since 1995."
    />
    <meta name="twitter:image" content="https://www.kks-online.com/og-image.jpg" />

    <!-- Structured data: the store (kept here so crawlers that do not run JavaScript also see it) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["GroceryStore", "Organization"],
        "@id": "https://www.kks-online.com/#store",
        "name": "KKS Online",
        "url": "https://www.kks-online.com/",
        "logo": "https://www.kks-online.com/icon-512.png",
        "image": "https://www.kks-online.com/og-image.jpg",
        "description": "Order daily grocery items online from KKS Online. Serving quality karyana, household essentials, and pantry staples in Pakistan since 1995.",
        "foundingDate": "1995",
        "telephone": "+923022500085",
        "email": "hello@kksonline.com.pk",
        "areaServed": { "@type": "Country", "name": "Pakistan" },
        "address": { "@type": "PostalAddress", "addressCountry": "PK" },
        "priceRange": "Rs"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.kks-online.com/#website",
        "url": "https://www.kks-online.com/",
        "name": "KKS Online",
        "publisher": { "@id": "https://www.kks-online.com/#store" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.kks-online.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <noscript>KKS Online: order daily grocery, karyana and household essentials in Pakistan. Please turn on JavaScript to shop.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
